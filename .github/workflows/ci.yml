name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# A run that is superseded by a newer commit is no longer useful.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Deterministic signing key for the CI run; production reads it from secrets.
      AUTH_SECRET: ci-only-secret-not-used-in-production-0123456789
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24 LTS is required for the built-in node:sqlite data layer.
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Seed CI fixture
        run: npm run db:setup

      - name: Build
        run: npm run build

      - name: Start the server
        run: |
          npm start &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "server up after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become ready in time" >&2
          exit 1

      - name: Smoke test (HTTP)
        run: npm run smoke

      - name: Checkout integrity test (cart, coupons, orders, no overselling)
        run: npm run test:orders
