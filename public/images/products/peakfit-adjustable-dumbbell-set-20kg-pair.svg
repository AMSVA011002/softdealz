<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="PeakFit Adjustable Dumbbell Set 20kg Pair">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(108 0.5 0.5)">
      <stop offset="0%" stop-color="#0c800f" />
      <stop offset="100%" stop-color="#0a57a0" />
    </linearGradient>
    <radialGradient id="glow" cx="69%" cy="45%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="21.599999999999998" stdDeviation="24" flood-color="#000000" flood-opacity="0.18" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)" />
  <rect width="1200" height="1200" fill="url(#grid)" />
  <rect width="1200" height="1200" fill="url(#glow)" />

  <circle cx="983.9999999999999" cy="192" r="264" fill="#ffffff" fill-opacity="0.06" />
  <circle cx="144" cy="1032" r="312" fill="#000000" fill-opacity="0.06" />

  <g filter="url(#soft)" transform="translate(348 252)">
    <rect width="504" height="504" rx="80.64" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.28" />
    <g transform="translate(80.64 80.64) scale(19.772307692307695)"
       fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
       stroke-opacity="0.95"><path d="M3 10v4" /><path d="M6 8v8" /><path d="M18 8v8" /><path d="M21 10v4" /><path d="M6 12h12" /></g>
  </g>

  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="838.8" font-size="62.4" font-weight="700" fill="#ffffff" fill-opacity="0.97">PeakFit Adjustable</text>
    <text x="600" y="913.1999999999999" font-size="62.4" font-weight="700" fill="#ffffff" fill-opacity="0.97">Dumbbell Set 20kg</text>
    <text x="600" y="987.5999999999999" font-size="62.4" font-weight="700" fill="#ffffff" fill-opacity="0.97">Pair</text>
  </g>
</svg>
