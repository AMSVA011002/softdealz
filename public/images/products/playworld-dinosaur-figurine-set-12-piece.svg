    <text x="600" y="838.8" font-size="62.4" font-weight="700" fill="#ffffff" fill-opacity="0.97">PlayWorld Dinosaur</text>
    <text x="600" y="913.1999999999999" font-size="62.4" font-weight="700" fill="#ffffff" fill-opacity="0.97">Figurine Set 12</text>
