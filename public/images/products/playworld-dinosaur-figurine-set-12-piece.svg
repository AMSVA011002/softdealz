       stroke-opacity="0.95"><path d="M9 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm6 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" /><path d="M6 21h12a6 6 0 0 0-6-6 6 6 0 0 0-6 6Z" /></g>
